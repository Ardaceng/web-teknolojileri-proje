<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlgi Alanlarım – Ali Arda Dilek</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: El yazısı tarzı özel yazı tipi -->

        rel="stylesheet">
    <!-- Özel CSS dosyamız -->
    <link rel="stylesheet" href="css/ilgi.css">
</head>

<body>

    <!-- Üst Menü (Navbar) -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html"
                style="font-family: 'Caveat', cursive; font-size: 2.5rem; color: #6B4C35 !important; font-weight: 700; padding: 0;">arda</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Hakkımda</a></li>
                    <li class="nav-item"><a class="nav-link" href="cv.html">CV</a></li>
                    <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
                    <li class="nav-item"><a class="nav-link" href="miras.html">Mirasımız</a></li>
                    <li class="nav-item"><a class="nav-link active" href="ilgi.html">İlgi Alanlarım</a></li>
                    <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Giriş</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">


        <!-- API Bölümü (Arama Motoru) -->
        <div class="api-section mt-3" style="background-color: #EFEFEF; padding: 40px 50px; border-radius: 8px;">
            <h2 class="mb-3"
                style="font-family: 'Inter', sans-serif; font-weight: 700; color: #4A342C; font-size: 36px; text-align: left; letter-spacing: -0.5px;">
                Dizi & Film Keşfet</h2>
            <p class="mb-4" style="text-align: left; color: #666; font-family: 'Inter', sans-serif; font-size: 16px;">
                İzlemek istediğin bir diziyi veya filmi arat, anında bilgi al.</p>

            <!-- Arama Çubuğu  -->
            <div class="input-group shadow-sm mb-5" style="height: 60px; border-radius: 6px; overflow: hidden;">
                <input type="text" id="searchInput" class="form-control" placeholder="Örn: Breaking Bad, Batman..."
                    style="font-family: 'Inter', sans-serif; border: none; background-color: #FFFFFF; font-size: 16px; padding-left: 20px; box-shadow: none;">
                <button id="searchButton" class="btn"
                    style="background-color: #333333; color: white; width: 90px; border: none; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;">
                    <span style="font-size: 16px; line-height: 1; margin-bottom: 3px;">🔍</span>
                    <span style="font-size: 14px; font-family: 'Inter', sans-serif;">Ara</span>
                </button>
            </div>

            <h3 class="hero-subtitle d-none text-center" id="resultsTitle">Arama Sonuçları</h3>
            <!-- Sonuçların Geleceği Kutu -->
            <div id="searchResults" class="row row-cols-1 row-cols-md-3 g-4 justify-content-center mb-2">
            </div>
        </div>

        <!-- Siyah Alt Bant  -->
        <div class="mt-4" style="background-color: #1A1A1A; padding: 25px 0; border-radius: 8px; text-align: center;">
            <div style="font-size: 24px; color: #b3b3b3; margin-bottom: 5px;">
                <span class="mx-3" style="cursor:pointer;" title="Github">🐱</span>
                <span class="mx-3" style="cursor:pointer;" title="Instagram">📷</span>
                <span class="mx-3" style="cursor:pointer;" title="Email">✉️</span>
                <span class="mx-3" style="cursor:pointer;" title="LinkedIn">💼</span>
            </div>
            <div style="color: #666; font-size: 12px; font-family: 'Inter', sans-serif;">
                © 2026 Ali Arda Dilek
            </div>
        </div>
    </main>

    <footer class="text-center py-3">✦ ali arda dilek · sakarya üniversitesi bilgisayar mühendisliği ✦</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1) Sayfa tamamen yüklendikten sonra kodların çalışmasını sağlar
        document.addEventListener('DOMContentLoaded', () => {
            const btnAra = document.getElementById('searchButton');
            const kutuArama = document.getElementById('searchInput');
            const sonucKutusu = document.getElementById('searchResults');
            const sonucBasligi = document.getElementById('resultsTitle');

            // 2) 'Ara' butonuna tıklandığında çalışacak olan işlem
            btnAra.addEventListener('click', async () => {
                const arananKelime = kutuArama.value.trim(); // Baştaki ve sondaki boşlukları temizler

                // Eğer kutu boşken butona basılırsa hiçbir şey yapmasın
                if (!arananKelime) return;

                // Arama sonuçları başlığını göster ve yükleniyor animasyonu ekle
                sonucBasligi.classList.remove('d-none');
                sonucKutusu.innerHTML = '<p style="font-family: Caveat, cursive; font-size: 24px;">Aranıyor... ⏳</p>';

                try {
                    // 3) TVMaze API'ye (Sunucuya) istek (request) atıyoruz
                    const response = await fetch(`https://api.tvmaze.com/search/shows?q=${arananKelime}`);
                    const veriler = await response.json(); // Gelen cevabı JSON formatına (anlamlı listeye) çevir

                    sonucKutusu.innerHTML = ''; // Eski sonuçları ekrandan temizle

                    // Gelen sonuçlardan sadece ilk 3 tanesini al (ekran çok dolmasın diye)
                    const ilkUcSonuc = veriler.slice(0, 3);

                    // Eğer hiç sonuç bulunamazsa kullanıcıya uyarı ver
                    if (ilkUcSonuc.length === 0) {
                        sonucKutusu.innerHTML = '<p style="font-family: Caveat, cursive; font-size: 24px;">Arama sonucu bulunamadı 😢</p>';
                        return;
                    }

                    // 4) Bulunan her bir dizi/film için ekranda bir "Polaroid Kadrajı" oluştur
                    for (const oge of ilkUcSonuc) {
                        const dizi = oge.show; // Gelen listedeki dizi objesini al

                        // Eğer dizinin resmi varsa onu kullan, yoksa kendi default resmimizi koy
                        const resim = dizi.image ? dizi.image.medium : 'images/film.jpg';
                        // Puanı varsa göster, yoksa "?" koy
                        const puan = dizi.rating?.average || '?';
                        // Tür bilgisi varsa ilkini al (Drama, Action vs.), yoksa Belirtilmemiş yaz
                        const tur = dizi.genres[0] || 'Tür Belirtilmemiş';

                        // Ekrana (HTML içine) oluşturduğumuz kartı ekle
                        sonucKutusu.innerHTML += `
                            <div class="col">
                                <div class="polaroid">
                                    <img src="${resim}" alt="${dizi.name}">
                                    <div class="polaroid-label">${dizi.name}</div>
                                    <div class="api-details">
                                        <span>${tur}</span> | <span>⭐ ${puan}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                } catch (hata) {
                    // Eğer internet yoksa veya API çökmüşse, program bozulmasın diye hatayı yakala
                    sonucKutusu.innerHTML = '<p style="font-family: Caveat, cursive; font-size: 24px;">Bağlantı hatası oluştu. Lütfen tekrar deneyin. 🛑</p>';
                    console.error("TVMaze API Hatası:", hata);
                }
            });

            // Kullanıcı Enter tuşuna basınca da "Ara" butonuna tıklanmış gibi tetikle
            kutuArama.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    btnAra.click();
                }
            });
        });
    </script>
</body>

</html>
